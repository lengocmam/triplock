version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: triplock_postgres
    environment:
      POSTGRES_USER: triplock
      POSTGRES_PASSWORD: triplock123
      POSTGRES_DB: triplock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: triplock_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: